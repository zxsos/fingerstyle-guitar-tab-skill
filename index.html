<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call of Silence · 指弹六线谱</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --paper: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.10);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 28px rgba(0, 0, 0, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font-family: inherit;
    }

    svg.ico {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex: none;
    }

    /* Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 56px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .top-bar-inner {
      max-width: 1040px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .bar-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .bar-title-wrap.visible {
      opacity: 1;
    }

    .bar-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .local-chip {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      flex: none;
    }

    .top-actions {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(24, 24, 27, 0.05);
    }

    .pill-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .pill-btn:hover {
      background: #fafafa;
      border-color: #d4d4d8;
    }

    /* Popover Menus */
    .popover {
      position: absolute;
      top: 42px;
      right: 0;
      min-width: 196px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px;
      z-index: 60;
      display: none;
    }

    .popover.open {
      display: block;
    }

    .menu-item {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      text-align: left;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .menu-item:hover {
      background: #f4f4f5;
    }

    .menu-note {
      padding: 5px 10px 4px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      margin-top: 4px;
    }

    /* Sheet Paper */
    .sheet-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 140px;
    }

    .sheet-paper {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }

    .sheet-header-crop {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .slice-viewport {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    .slice-viewport.loading {
      background: linear-gradient(90deg, #f4f4f5 25%, #e4e4e7 50%, #f4f4f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite linear;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .slice-viewport img {
      position: absolute;
      left: 0;
      width: 100%;
      height: auto;
      max-width: none;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .systems-flow {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sys-row {
      position: relative;
      transition: opacity 240ms ease;
    }

    .sheet-paper.started .sys-row:not(.is-active) {
      opacity: 0.3;
    }

    .sheet-paper.started .sys-row:not(.is-active):hover {
      opacity: 0.7;
    }

    .sys-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .karaoke-fill {
      position: absolute;
      border-radius: 4px;
      background: linear-gradient(90deg, rgba(79, 70, 229, 0.08), rgba(79, 70, 229, 0.20));
      mix-blend-mode: multiply;
      opacity: 0;
      pointer-events: none;
      will-change: width;
    }

    .sys-row.is-active .karaoke-fill.visible {
      opacity: 1;
    }

    .active-bar-box {
      position: absolute;
      border-radius: 6px;
      background: rgba(79, 70, 229, 0.07);
      mix-blend-mode: multiply;
      opacity: 0;
      transition: left 0.12s ease, width 0.12s ease, opacity 0.15s ease;
      pointer-events: none;
    }

    .sys-row.is-active .active-bar-box.visible {
      opacity: 1;
    }

    .playhead {
      position: absolute;
      width: 2px;
      background: var(--accent);
      border-radius: 2px;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      will-change: left;
    }

    .sys-row.is-active .playhead.visible {
      opacity: 1;
    }

    .playhead::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateX(-50%);
    }

    .hotspots-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .bar-hotspot {
      position: absolute;
      top: 0;
      height: 100%;
      pointer-events: auto;
      background: transparent;
      border: 0;
      border-radius: 4px;
      padding: 0;
      margin: 0;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .bar-hotspot:hover,
    .bar-hotspot:focus-visible {
      background: rgba(24, 24, 27, 0.04);
      outline: none;
    }

    /* Floating Locate Pill */
    .locate-pill {
      position: fixed;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%) translateY(8px);
      z-index: 44;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .locate-pill.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* Floating Bottom Player */
    .player-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      z-index: 45;
      width: min(960px, calc(100% - 24px));
      height: 68px;
      padding: 0 16px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
    }

    .pb-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .skip-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .skip-btn:hover {
      color: var(--text);
      background: rgba(24, 24, 27, 0.05);
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.32);
      transition: transform 0.1s ease, filter 0.15s ease;
    }

    .play-btn:hover {
      filter: brightness(1.06);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .pb-center {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .pb-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .pb-info {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .pb-section {
      font-weight: 600;
      color: var(--text);
    }

    .pb-dot {
      color: var(--muted);
    }

    .pb-chord {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pb-time {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      flex: none;
    }

    /* Custom Scrubber */
    .scrubber {
      position: relative;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
      outline: none;
    }

    .scrub-track {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: var(--line);
      transition: height 0.12s ease;
    }

    .scrubber:hover .scrub-track,
    .scrubber.dragging .scrub-track,
    .scrubber:focus-visible .scrub-track {
      height: 6px;
    }

    .scrub-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--accent);
      pointer-events: none;
    }

    .scrub-markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .scrub-tick {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--paper);
      transform: translateX(-50%);
      opacity: 0.92;
    }

    .scrub-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.12s ease;
      pointer-events: none;
    }

    .scrubber:hover .scrub-thumb,
    .scrubber.dragging .scrub-thumb,
    .scrubber:focus-visible .scrub-thumb {
      transform: translate(-50%, -50%) scale(1);
    }

    .scrub-tip {
      position: absolute;
      bottom: 24px;
      left: 0%;
      transform: translateX(-50%);
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--text);
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease;
    }

    .scrub-tip.visible {
      opacity: 1;
    }

    .speed-btn {
      height: 30px;
      min-width: 48px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .speed-btn:hover {
      background: #f4f4f5;
    }

    /* Fullscreen Drop Overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .drop-overlay.open {
      display: flex;
    }

    .drop-box {
      width: min(420px, 100%);
      padding: 44px 24px;
      border: 2px dashed var(--accent);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;
    }

    /* Toasts */
    .toasts {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      z-index: 95;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: min(440px, calc(100% - 24px));
    }

    .toast {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--text);
      color: #ffffff;
      font-size: 13px;
      box-shadow: var(--shadow);
    }

    .toast.error {
      background: #b91c1c;
    }

    .toast-spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast-act {
      padding: 3px 9px;
      border-radius: 7px;
      border: 0;
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: none;
    }

    .toast-act:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(24, 24, 27, 0.48);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: min(380px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
    }

    .modal-card.wide {
      width: min(1020px, 100%);
      padding: 14px 16px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .modal-filename {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: none;
    }

    .pdf-frame {
      width: 100%;
      height: min(80vh, 900px);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f4f4f5;
      display: block;
    }

    .cal-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cal-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .cal-field input[type="number"] {
      height: 36px;
      padding: 0 10px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--text);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .cal-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }

    .cal-check input {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
    }

    .cal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-primary {
      height: 34px;
      padding: 0 14px;
      border-radius: 9px;
      border: 0;
      background: var(--accent);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost {
      height: 34px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .hidden-input,
    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .sheet-wrap {
        padding: 12px 8px 128px;
      }
      .sheet-paper {
        padding: 12px 6px;
        border-radius: 12px;
      }
      .player-bar {
        padding: 0 12px;
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .skip-btn {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand-left">
        <span class="brand-logo" aria-hidden="true">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <div class="bar-title-wrap" id="bar-title-wrap">
          <span class="bar-title" id="bar-title">Call of Silence</span>
          <span class="local-chip hidden" id="bar-local-chip">本地</span>
        </div>
      </div>

      <div class="top-actions">
        <button type="button" class="pill-btn" id="import-btn" aria-haspopup="true" aria-expanded="false">
          <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导入
        </button>

        <button type="button" class="icon-btn" id="open-pdf-btn" title="原版 PDF" aria-label="原版 PDF">
          <svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </button>

        <button type="button" class="icon-btn" id="more-btn" title="更多" aria-label="更多" aria-haspopup="true" aria-expanded="false">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>

      const importBtn = document.getElementById("import-btn");
      const importMenu = document.getElementById("import-menu");
      const moreBtn = document.getElementById("more-btn");
      const moreMenu = document.getElementById("more-menu");
      const openPdfBtn = document.getElementById("open-pdf-btn");
      const menuDlMp3 = document.getElementById("menu-dl-mp3");
      const menuDlPdf = document.getElementById("menu-dl-pdf");
      const menuCalibrate = document.getElementById("menu-calibrate");
      const menuResetBuiltin = document.getElementById("menu-reset-builtin");

      const sheetPaper = document.getElementById("sheet-paper");
      const headerCropEl = document.getElementById("sheet-header-crop");
      const systemsFlowEl = document.getElementById("systems-flow");
      const locatePill = document.getElementById("locate-pill");

      const playerBar = document.getElementById("player-bar");
      const playBtn = document.getElementById("play-btn");
      const playIcon = document.getElementById("play-icon");
      const pauseIcon = document.getElementById("pause-icon");
      const pbSection = document.getElementById("pb-section");
      const pbDot = document.getElementById("pb-dot");
      const pbChord = document.getElementById("pb-chord");
      const pbTime = document.getElementById("pb-time");
      const speedBtn = document.getElementById("speed-btn");

      const scrubber = document.getElementById("scrubber");
      const scrubFill = document.getElementById("scrub-fill");
      const scrubMarkers = document.getElementById("scrub-markers");
      const scrubThumb = document.getElementById("scrub-thumb");
      const scrubTip = document.getElementById("scrub-tip");

      const dropOverlay = document.getElementById("drop-overlay");
      const toastsEl = document.getElementById("toasts");
      const pdfModal = document.getElementById("pdf-modal");
      const pdfIframe = document.getElementById("pdf-iframe");
      const pdfFilename = document.getElementById("pdf-filename");
      const pdfNewtabLink = document.getElementById("pdf-newtab-link");
      const pdfDownloadLink = document.getElementById("pdf-download-link");

      const calModal = document.getElementById("cal-modal");
      const calForm = document.getElementById("cal-form");
      const calBpmInput = document.getElementById("cal-bpm");
      const calLeadInInput = document.getElementById("cal-leadin");
      const calPickupInput = document.getElementById("cal-pickup");

      const dirInput = document.getElementById("dir-input");
      const filesInput = document.getElementById("files-input");

      const SPEEDS = [1, 0.75, 0.5];
      let speedIdx = 0;

      let activeManifest = null;
      let activePageUrls = [];
      let activeObjectUrls = [];
      let activeDetection = null;
      let activeTitle = "";
      let isImported = false;
      let hasStarted = false;
      let followPaused = false;
      let programmaticScrollUntil = 0;
      let rowRefs = [];
      let lastSysIdx = -1;
      let rafId = null;
      let headerObserver = null;
      let draggingScrub = false;

      function fmtTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return m + ":" + (r < 10 ? "0" : "") + r;
      }

      function getDuration() {
        if (Number.isFinite(player.duration) && player.duration > 0) return player.duration;
        return activeManifest && activeManifest.duration ? activeManifest.duration : 0;
      }

      function revokeImportedUrls() {
        activeObjectUrls.forEach((u) => URL.revokeObjectURL(u));
        activeObjectUrls = [];
      }

      function closePopovers() {
        importMenu.classList.remove("open");
        moreMenu.classList.remove("open");
        importBtn.setAttribute("aria-expanded", "false");
        moreBtn.setAttribute("aria-expanded", "false");
      }

      function togglePopover(pop, btn) {
        const wasOpen = pop.classList.contains("open");
        closePopovers();
        if (!wasOpen) {
          pop.classList.add("open");
          btn.setAttribute("aria-expanded", "true");
        }
      }

      function showToast(msg, opts) {
        const o = opts || {};
        const el = document.createElement("div");
        el.className = "toast" + (o.type === "error" ? " error" : "");

        if (o.loading) {
          const sp = document.createElement("span");
          sp.className = "toast-spinner";
          el.appendChild(sp);
        }

        const txt = document.createElement("span");
        txt.textContent = msg;
        el.appendChild(txt);

        if (o.actionLabel && o.onAction) {
          const act = document.createElement("button");
          act.type = "button";
          act.className = "toast-act";
          act.textContent = o.actionLabel;
          act.addEventListener("click", () => {
            o.onAction();
            el.remove();
          });
          el.appendChild(act);
        }

        toastsEl.appendChild(el);
        if (o.duration > 0) {
          setTimeout(() => el.remove(), o.duration);
        }
        return el;
      }

      function createSliceViewport(imgUrl, natW, sliceY0, sliceY1) {
        const sliceH = Math.max(1, sliceY1 - sliceY0);
        const vp = document.createElement("div");
        vp.className = "slice-viewport loading";
        vp.style.paddingTop = ((sliceH / natW) * 100).toFixed(4) + "%";

        const img = document.createElement("img");
        img.alt = "六线谱";
        img.draggable = false;
        img.style.top = (-(sliceY0 / sliceH) * 100).toFixed(4) + "%";
        img.addEventListener("load", () => vp.classList.remove("loading"), { once: true });
        img.addEventListener("error", () => vp.classList.remove("loading"), { once: true });
        img.src = imgUrl;
        if (img.complete) vp.classList.remove("loading");

        vp.appendChild(img);
        return vp;
      }

      function markStarted() {
        if (!hasStarted) {
          hasStarted = true;
          sheetPaper.classList.add("started");
        }
      }

      function updatePlayIcon() {
        const playing = !player.paused && !player.ended;
        playIcon.classList.toggle("hidden", playing);
        pauseIcon.classList.toggle("hidden", !playing);
      }

      function setMedia(audioUrl, pdfUrl, pdfName) {
        player.pause();
        stopRaf();
        locatePill.classList.remove("visible");
        player.src = audioUrl;
        player.load();
        player.playbackRate = SPEEDS[speedIdx];
        updatePlayIcon();

        menuDlMp3.href = audioUrl;
        menuDlMp3.download = (activeManifest && activeManifest.audio) ? activeManifest.audio : "audio.mp3";

        if (pdfUrl) {
          openPdfBtn.classList.remove("hidden");
          menuDlPdf.classList.remove("hidden");
          menuDlPdf.href = pdfUrl;
          menuDlPdf.download = pdfName || "score.pdf";
          pdfFilename.textContent = pdfName || "score.pdf";
          pdfNewtabLink.href = pdfUrl;
          pdfDownloadLink.href = pdfUrl;
          pdfDownloadLink.download = pdfName || "score.pdf";
          pdfIframe.dataset.src = pdfUrl;
          pdfIframe.setAttribute("src", "about:blank");
        } else {
          openPdfBtn.classList.add("hidden");
          menuDlPdf.classList.add("hidden");
          delete pdfIframe.dataset.src;
          pdfIframe.setAttribute("src", "about:blank");
        }
      }

      function setupHeaderObserver(hasHeader) {
        if (headerObserver) {
          headerObserver.disconnect();
          headerObserver = null;
        }
        if (!hasHeader) {
          barTitleWrap.classList.add("visible");
          return;
        }
        barTitleWrap.classList.remove("visible");
        headerObserver = new IntersectionObserver(
          (entries) => {
            const visible = entries[0] && entries[0].isIntersecting;
            barTitleWrap.classList.toggle("visible", !visible);
          },
          { rootMargin: "-56px 0px 0px 0px", threshold: 0.05 }
        );
        headerObserver.observe(headerCropEl);
      }

      function renderManifest(manifest, pageUrls) {
        activeManifest = manifest;
        activePageUrls = pageUrls;
        const title = manifest.title || "未命名作品";
        activeTitle = title;
        barTitle.textContent = title;
        document.title = title + " · 指弹六线谱";
        if (manifest.audio) menuDlMp3.download = manifest.audio;
        barLocalChip.classList.toggle("hidden", !isImported);
        menuResetBuiltin.classList.toggle("hidden", !isImported);
        menuCalibrate.classList.toggle("hidden", !activeDetection);

        // Header crop
        headerCropEl.innerHTML = "";
        const hasHeader = Boolean(manifest.header && pageUrls[manifest.header.page - 1]);
        if (hasHeader) {
          headerCropEl.classList.remove("hidden");
          const h = manifest.header;
          headerCropEl.appendChild(
            createSliceViewport(pageUrls[h.page - 1], h.width, h.sliceY[0], h.sliceY[1])
          );
        } else {
          headerCropEl.classList.add("hidden");
        }
        setupHeaderObserver(hasHeader);

        // Scrubber section markers
        scrubMarkers.innerHTML = "";
        const dur = getDuration();
        if (dur > 0 && manifest.sections) {
          manifest.sections.forEach((sec) => {
            if (sec.start <= 0.5) return;
            const pct = Math.min(99.5, Math.max(0.5, (sec.start / dur) * 100));
            const tick = document.createElement("span");
            tick.className = "scrub-tick";
            tick.style.left = pct.toFixed(3) + "%";
            scrubMarkers.appendChild(tick);
          });
        }

        // System rows
        systemsFlowEl.innerHTML = "";
        rowRefs = [];
        manifest.systems.forEach((sys) => {
          const row = document.createElement("article");
          row.className = "sys-row";
          row.dataset.sysIdx = String(sys.sysIdx);

          const imgUrl = pageUrls[sys.page - 1];
          const [sy0, sy1] = sys.sliceY;
          const sliceH = Math.max(1, sy1 - sy0);
          const vp = createSliceViewport(imgUrl, sys.width, sy0, sy1);

          const overlay = document.createElement("div");
          overlay.className = "sys-overlay";

          const fillTop = Math.max(0, sys.staffY[0] - 8 - sy0);
          const fillH = Math.max(1, Math.min(sliceH, sys.staffY[1] + 8 - sy0) - fillTop);
          const boxTop = Math.max(0, sys.staffY[0] - 10 - sy0);
          const boxH = Math.max(1, Math.min(sliceH, sys.staffY[1] + 10 - sy0) - boxTop);
          const needleTop = Math.max(0, sys.staffY[0] - 14 - sy0);
          const needleH = Math.max(1, Math.min(sliceH, sys.staffY[1] + 14 - sy0) - needleTop);

          const karaokeFill = document.createElement("div");
          karaokeFill.className = "karaoke-fill";
          karaokeFill.style.top = (fillTop / sliceH * 100).toFixed(4) + "%";
          karaokeFill.style.height = (fillH / sliceH * 100).toFixed(4) + "%";
          karaokeFill.style.left = ((sys.x0 / sys.width) * 100).toFixed(4) + "%";
          karaokeFill.style.width = "0%";

          const activeBarBox = document.createElement("div");
          activeBarBox.className = "active-bar-box";
          activeBarBox.style.top = (boxTop / sliceH * 100).toFixed(4) + "%";
          activeBarBox.style.height = (boxH / sliceH * 100).toFixed(4) + "%";

          const playhead = document.createElement("div");
          playhead.className = "playhead";
          playhead.style.top = (needleTop / sliceH * 100).toFixed(4) + "%";
          playhead.style.height = (needleH / sliceH * 100).toFixed(4) + "%";

          const hotspotsLayer = document.createElement("div");
          hotspotsLayer.className = "hotspots-layer";
          sys.bars.forEach((b) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "bar-hotspot";
            btn.style.left = ((b.x0 / sys.width) * 100).toFixed(4) + "%";
            btn.style.width = (((b.x1 - b.x0) / sys.width) * 100).toFixed(4) + "%";
            const label = "M" + b.bar + " · " + fmtTime(b.start);
            btn.title = label;
            btn.setAttribute("aria-label", label);
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              seekAndPlayBar(b);
            });
            hotspotsLayer.appendChild(btn);
          });

          overlay.append(karaokeFill, activeBarBox, playhead, hotspotsLayer);
          vp.appendChild(overlay);
          row.appendChild(vp);
          systemsFlowEl.appendChild(row);

          rowRefs.push({ sys, row, karaokeFill, activeBarBox, playhead });
        });

        lastSysIdx = 0;
        renderSync(player.currentTime || 0);
      }

      function findPlaybackState(t) {
        const bars = activeManifest.bars;
        let activeBar = bars[0];
        if (t >= bars[bars.length - 1].end) {
          activeBar = bars[bars.length - 1];
        } else if (t > bars[0].start) {
          for (let i = 0; i < bars.length; i++) {
            if (t >= bars[i].start && t < bars[i].end) {
              activeBar = bars[i];
              break;
            }
          }
        }
        const sys = activeManifest.systems[activeBar.sysIdx];
        const span = Math.max(0.001, activeBar.end - activeBar.start);
        const frac = Math.max(0, Math.min(1, (t - activeBar.start) / span));
        const cursorX = activeBar.x0 + (activeBar.x1 - activeBar.x0) * frac;
        return { bar: activeBar, sys, cursorX };
      }

      function setFollowPaused(paused) {
        followPaused = paused;
        locatePill.classList.toggle("visible", paused && !player.paused);
      }

      function scrollToSystem(sysIdx, force) {
        if (!force && followPaused) return;
        const ref = rowRefs[sysIdx];
        if (!ref) return;
        const rect = ref.row.getBoundingClientRect();
        if (rect.height <= 0) return;

        const topBarH = topBar.getBoundingClientRect().height;
        const playerBarH = playerBar.getBoundingClientRect().height;
        const avail = Math.max(120, window.innerHeight - topBarH - playerBarH - 32 - rect.height);
        const targetY = Math.max(0, rect.top + window.scrollY - topBarH - Math.max(16, avail * 0.35));

        programmaticScrollUntil = performance.now() + 900;
        window.scrollTo({ top: targetY, behavior: "smooth" });
      }

      function seekAndPlayBar(bar) {
        markStarted();
        setFollowPaused(false);
        const targetTime = bar.bar === 0 ? 0.0 : bar.start;
        const sysChanged = bar.sysIdx !== lastSysIdx;
        player.currentTime = targetTime;
        lastSysIdx = bar.sysIdx;
        renderSync(targetTime);
        if (sysChanged) {
          scrollToSystem(bar.sysIdx, true);
        }
        player.play().catch(() => {});
      }

      function seekToTime(targetSec, resumeFollow) {
        markStarted();
        const dur = getDuration();
        const clamped = Math.max(0, Math.min(dur, targetSec));
        if (resumeFollow) setFollowPaused(false);
        player.currentTime = clamped;
        const state = findPlaybackState(clamped);
        lastSysIdx = state.sys.sysIdx;
        renderSync(clamped);
        if (resumeFollow) scrollToSystem(state.sys.sysIdx, true);
      }

      function renderSync(t) {
        if (!activeManifest) return;
        const { bar, sys, cursorX } = findPlaybackState(t);
        const dur = getDuration();
        const pct = dur > 0 ? Math.max(0, Math.min(100, (t / dur) * 100)) : 0;

        pbSection.textContent = bar.sec || activeTitle;
        const chordTxt = bar.chords || ("M" + String(bar.bar).padStart(2, "0"));
        pbChord.textContent = chordTxt;
        pbDot.classList.toggle("hidden", !chordTxt);
        pbTime.textContent = fmtTime(t) + " / " + fmtTime(dur);

        if (!draggingScrub) {
          scrubFill.style.width = pct.toFixed(3) + "%";
          scrubThumb.style.left = pct.toFixed(3) + "%";
          scrubber.setAttribute("aria-valuenow", String(Math.round(pct)));
        }

        rowRefs.forEach((ref, idx) => {
          const isCur = idx === sys.sysIdx;
          ref.row.classList.toggle("is-active", isCur);

          if (!isCur || !hasStarted) {
            ref.karaokeFill.classList.remove("visible");
            ref.activeBarBox.classList.remove("visible");
            ref.playhead.classList.remove("visible");
            return;
          }

          ref.karaokeFill.style.width = (Math.max(0, cursorX - sys.x0) / sys.width * 100).toFixed(4) + "%";
          ref.karaokeFill.classList.add("visible");

          ref.activeBarBox.style.left = ((bar.x0 / sys.width) * 100).toFixed(4) + "%";
          ref.activeBarBox.style.width = (((bar.x1 - bar.x0) / sys.width) * 100).toFixed(4) + "%";
          ref.activeBarBox.classList.add("visible");

          ref.playhead.style.left = ((cursorX / sys.width) * 100).toFixed(4) + "%";
          ref.playhead.classList.add("visible");
        });

        if (sys.sysIdx !== lastSysIdx) {
          const prev = lastSysIdx;
          lastSysIdx = sys.sysIdx;
          if (prev !== -1 && !player.paused && !followPaused) {
            scrollToSystem(sys.sysIdx, false);
          }
        }
      }

      function startRaf() {
        if (rafId !== null) return;
        const tick = () => {
          renderSync(player.currentTime || 0);
          if (!player.paused && !player.ended) {
            rafId = requestAnimationFrame(tick);
          } else {
            rafId = null;
          }
        };
        rafId = requestAnimationFrame(tick);
      }

      function stopRaf() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      // Player Controls
      playBtn.addEventListener("click", () => {
        markStarted();
        if (player.paused || player.ended) {
          setFollowPaused(false);
          const state = findPlaybackState(player.currentTime || 0);
          scrollToSystem(state.sys.sysIdx, true);
          player.play().catch(() => {});
        } else {
          player.pause();
        }
      });

      document.getElementById("seek-back").addEventListener("click", () => {
        seekToTime((player.currentTime || 0) - 5, true);
      });

      document.getElementById("seek-fwd").addEventListener("click", () => {
        seekToTime((player.currentTime || 0) + 5, true);
      });

      speedBtn.addEventListener("click", () => {
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        const rate = SPEEDS[speedIdx];
        player.playbackRate = rate;
        speedBtn.textContent = rate + "×";
      });

      locatePill.addEventListener("click", () => {
        setFollowPaused(false);
        const state = findPlaybackState(player.currentTime || 0);
        scrollToSystem(state.sys.sysIdx, true);
      });

      // Scrubber Pointer Events
      function scrubFraction(clientX) {
        const rect = scrubber.getBoundingClientRect();
        if (rect.width <= 0) return 0;
        return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      }

      function showScrubTip(frac) {
        const dur = getDuration();
        const t = frac * dur;
        const st = activeManifest ? findPlaybackState(t) : null;
        scrubTip.textContent = (st ? "M" + st.bar.bar + " · " : "") + fmtTime(t);
        scrubTip.style.left = (frac * 100).toFixed(2) + "%";
        scrubTip.classList.add("visible");
      }

      scrubber.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        scrubber.setPointerCapture(e.pointerId);
        draggingScrub = true;
        scrubber.classList.add("dragging");
        const frac = scrubFraction(e.clientX);
        scrubFill.style.width = (frac * 100).toFixed(3) + "%";
        scrubThumb.style.left = (frac * 100).toFixed(3) + "%";
        showScrubTip(frac);
      });

      scrubber.addEventListener("pointermove", (e) => {
        const frac = scrubFraction(e.clientX);
        showScrubTip(frac);
        if (draggingScrub) {
          scrubFill.style.width = (frac * 100).toFixed(3) + "%";
          scrubThumb.style.left = (frac * 100).toFixed(3) + "%";
        }
      });

      scrubber.addEventListener("pointerup", (e) => {
        if (!draggingScrub) return;
        draggingScrub = false;
        scrubber.classList.remove("dragging");
        scrubTip.classList.remove("visible");
        const frac = scrubFraction(e.clientX);
        seekToTime(frac * getDuration(), true);
      });

      scrubber.addEventListener("pointerleave", () => {
        if (!draggingScrub) scrubTip.classList.remove("visible");
      });

      scrubber.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          seekToTime((player.currentTime || 0) - 5, true);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          seekToTime((player.currentTime || 0) + 5, true);
        }
      });

      // Audio Events
      player.addEventListener("play", () => {
        markStarted();
        updatePlayIcon();
        locatePill.classList.toggle("visible", followPaused);
        startRaf();
      });
      player.addEventListener("playing", () => {
        updatePlayIcon();
        startRaf();
      });
      player.addEventListener("pause", () => {
        stopRaf();
        updatePlayIcon();
        locatePill.classList.remove("visible");
        renderSync(player.currentTime || 0);
      });
      player.addEventListener("ended", () => {
        stopRaf();
        updatePlayIcon();
        locatePill.classList.remove("visible");
        renderSync(player.currentTime || 0);
      });
      player.addEventListener("loadedmetadata", () => {
        if (activeManifest) {
          renderManifest(activeManifest, activePageUrls);
        }
      });
      player.addEventListener("timeupdate", () => {
        if (rafId === null) renderSync(player.currentTime || 0);
      });

      // Detect Manual Scrolling While Playing
      function onUserScrollIntent() {
        if (!player.paused && !player.ended && performance.now() > programmaticScrollUntil) {
          setFollowPaused(true);
        }
      }

      window.addEventListener("wheel", onUserScrollIntent, { passive: true });
      window.addEventListener("touchmove", onUserScrollIntent, { passive: true });
      window.addEventListener("scroll", onUserScrollIntent, { passive: true });

      // Popovers & Modals
      importBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        togglePopover(importMenu, importBtn);
      });

      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        togglePopover(moreMenu, moreBtn);
      });

      document.addEventListener("click", (e) => {
        if (!importMenu.contains(e.target) && e.target !== importBtn && !moreMenu.contains(e.target) && e.target !== moreBtn) {
          closePopovers();
        }
      });

      document.getElementById("pick-dir-btn").addEventListener("click", () => {
        closePopovers();
        dirInput.value = "";
        dirInput.click();
      });

      document.getElementById("pick-files-btn").addEventListener("click", () => {
        closePopovers();
        filesInput.value = "";
        filesInput.click();
      });

      dirInput.addEventListener("change", () => {
        if (dirInput.files && dirInput.files.length) {
          handleImportedFiles(Array.from(dirInput.files));
        }
      });

      filesInput.addEventListener("change", () => {
        if (filesInput.files && filesInput.files.length) {
          handleImportedFiles(Array.from(filesInput.files));
        }
      });

      openPdfBtn.addEventListener("click", () => {
        closePopovers();
        const src = pdfIframe.dataset.src;
        if (!src) return;
        if (pdfIframe.getAttribute("src") !== src) {
          pdfIframe.setAttribute("src", src);
        }
        pdfModal.classList.add("open");
      });

      document.getElementById("close-pdf-btn").addEventListener("click", () => {
        pdfModal.classList.remove("open");
      });
      pdfModal.addEventListener("click", (e) => {
        if (e.target === pdfModal) pdfModal.classList.remove("open");
      });

      function openCalibrationModal() {
        if (!activeDetection || !activeManifest) return;
        closePopovers();
        calBpmInput.value = activeDetection.lastParams.bpm;
        calLeadInInput.value = activeDetection.lastParams.leadIn;
        calPickupInput.checked = activeDetection.lastParams.pickup;
        calModal.classList.add("open");
      }

      menuCalibrate.addEventListener("click", openCalibrationModal);
      document.getElementById("close-cal-btn").addEventListener("click", () => calModal.classList.remove("open"));
      document.getElementById("cal-cancel-btn").addEventListener("click", () => calModal.classList.remove("open"));
      calModal.addEventListener("click", (e) => {
        if (e.target === calModal) calModal.classList.remove("open");
      });

      calForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!activeDetection) return;
        const bpm = Math.max(20, Math.min(260, Number(calBpmInput.value) || 72));
        const leadIn = Math.max(0, Number(calLeadInInput.value) || 0);
        const pickup = calPickupInput.checked;
        activeDetection.lastParams = { bpm, leadIn, pickup, title: activeTitle };
        const updated = buildManifestFromDetection(activeDetection, activeDetection.lastParams);
        renderManifest(updated, activePageUrls);
        calModal.classList.remove("open");
        showToast("已更新同步时间轴", { duration: 2500 });
      });

      document.getElementById("menu-export-json").addEventListener("click", () => {
        closePopovers();
        if (activeManifest) triggerDownloadJson(activeManifest);
      });

      menuResetBuiltin.addEventListener("click", () => {
        closePopovers();
        loadBuiltinProject();
        showToast("已恢复内置示例曲目", { duration: 2500 });
      });

      // Global Drag & Drop
      let dragDepth = 0;

      function hasFilesTransfer(e) {
        const types = e.dataTransfer && e.dataTransfer.types;
        return types && Array.from(types).includes("Files");
      }

      window.addEventListener("dragenter", (e) => {
        if (!hasFilesTransfer(e)) return;
        e.preventDefault();
        dragDepth++;
        dropOverlay.classList.add("open");
      });

      window.addEventListener("dragover", (e) => {
        if (!hasFilesTransfer(e)) return;
        e.preventDefault();
      });

      window.addEventListener("dragleave", (e) => {
        if (!hasFilesTransfer(e)) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) dropOverlay.classList.remove("open");
      });

      window.addEventListener("drop", async (e) => {
        if (!hasFilesTransfer(e)) return;
        e.preventDefault();
        dragDepth = 0;
        dropOverlay.classList.remove("open");

        const dt = e.dataTransfer;
        const items = dt.items ? Array.from(dt.items) : [];
        const entries = items.map((it) => (it.webkitGetAsEntry ? it.webkitGetAsEntry() : null)).filter(Boolean);
        if (entries.length) {
          const collected = [];
          for (const ent of entries) {
            collected.push(...(await collectEntryFiles(ent, "")));
          }
          await handleImportedFiles(collected);
        } else if (dt.files && dt.files.length) {
          await handleImportedFiles(Array.from(dt.files));
        }
      });

      // Keyboard Shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closePopovers();
          pdfModal.classList.remove("open");
          calModal.classList.remove("open");
          return;
        }
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
        const inModalOrInput =
          ["INPUT", "TEXTAREA", "SELECT"].includes(tag) ||
          (e.target && e.target.isContentEditable) ||
          pdfModal.classList.contains("open") ||
          calModal.classList.contains("open") ||
          importMenu.classList.contains("open") ||
          moreMenu.classList.contains("open");

        if (inModalOrInput) return;

        if (e.code === "Space" && tag !== "BUTTON" && tag !== "A") {
          e.preventDefault();
          playBtn.click();
        } else if (e.key === "ArrowLeft" && e.target !== scrubber) {
          e.preventDefault();
          seekToTime((player.currentTime || 0) - 5, true);
        } else if (e.key === "ArrowRight" && e.target !== scrubber) {
          e.preventDefault();
          seekToTime((player.currentTime || 0) + 5, true);
        } else if (["PageUp", "PageDown", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) {
          onUserScrollIntent();
        }
      });

      // =========================================================================
      // File Parsing & Canvas Auto-Detection Helpers (reused)
      // =========================================================================
      const IGNORED_DIRS = new Set([".tools", "build", ".git", "__pycache__", "node_modules"]);

      async function collectEntryFiles(entry, relPrefix) {
        if (entry.isFile) {
          const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
          Object.defineProperty(file, "_relPath", { value: relPrefix + entry.name });
          return [file];
        }
        if (entry.isDirectory) {
          if (IGNORED_DIRS.has(entry.name)) return [];
          const reader = entry.createReader();
          const allEntries = [];
          while (true) {
            const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
            if (!batch.length) break;
            allEntries.push(...batch);
          }
          const nested = [];
          for (const child of allEntries) {
            nested.push(...(await collectEntryFiles(child, relPrefix + entry.name + "/")));
          }
          return nested;
        }
        return [];
      }

      function fileRel(f) {
        return f._relPath || f.webkitRelativePath || f.name;
      }

      function isIgnoredPath(rel) {
        const parts = rel.split("/");
        return parts.some((p) => IGNORED_DIRS.has(p));
      }

      function parsePageNum(name) {
        const m = name.match(/(\d+)/);
        return m ? parseInt(m[1], 10) : 0;
      }

      function parseScoreDataPy(pyText) {
        const strVal = (k) => {
          const m = pyText.match(new RegExp("^" + k + "\\s*=\\s*[\"']([^\"']+)[\"']", "m"));
          return m ? m[1] : "";
        };
        const numVal = (k) => {
          const m = pyText.match(new RegExp("^" + k + "\\s*=\\s*([0-9.]+)", "m"));
          return m ? Number(m[1]) : null;
        };

        const title = strVal("TITLE");
        const subtitle = strVal("SUBTITLE");
        const composer = strVal("COMPOSER");
        const arrangerInfo = strVal("ARRANGER_INFO");
        const bpm = numVal("TEMPO_BPM");
        const capo = numVal("CAPO");

        const barChunks = pyText.split(/m\.append\(\s*Measure\(/).slice(1);
        const parsedBars = {};
        for (const chunk of barChunks) {
          const bm = chunk.match(/\bbar\s*=\s*(\d+)/);
          if (!bm) continue;
          const b = parseInt(bm[1], 10);
          const isPickup = /\bis_pickup\s*=\s*True\b/.test(chunk);
          const secM = chunk.match(/\bsection\s*=\s*["']([^"']+)["']/);
          const chM = chunk.match(/\bchords\s*=\s*\[([^\]]*)\]/);
          let chords = "";
          if (chM) {
            const labels = [];
            const itemRe = /["']([^"']+)["']/g;
            let im;
            while ((im = itemRe.exec(chM[1])) !== null) labels.push(im[1]);
            chords = labels.join(" → ");
          }
          parsedBars[b] = { isPickup, section: secM ? secM[1] : "", chords };
        }

        return { title, subtitle, composer, arrangerInfo, bpm, capo, parsedBars };
      }

      function parsePhraseCuesPy(pyText) {
        const cues = {};
        const block = pyText.match(/PHRASE_CUES[^=]*=\s*\{([\s\S]*?)\}/);
        if (!block) return cues;
        const rowRe = /\(\s*(\d+)\s*,\s*\d+\s*\)\s*:\s*["']([^"']+)["']/g;
        let m;
        while ((m = rowRe.exec(block[1])) !== null) {
          cues[parseInt(m[1], 10)] = m[2];
        }
        return cues;
      }

      function probeAudioFileDuration(audioFile) {
        return new Promise((resolve) => {
          const url = URL.createObjectURL(audioFile);
          const tmp = document.createElement("audio");
          tmp.preload = "metadata";
          tmp.onloadedmetadata = () => {
            const dur = Number.isFinite(tmp.duration) ? tmp.duration : 0;
            URL.revokeObjectURL(url);
            resolve(dur);
          };
          tmp.onerror = () => {
            URL.revokeObjectURL(url);
            resolve(0);
          };
          tmp.src = url;
        });
      }

      function whiteGapMidJS(rowHasInk, yLo, yHi, h) {
        const lo = Math.max(0, yLo);
        const hi = Math.min(h - 1, yHi);
        if (lo > hi) return Math.max(0, Math.min(h - 1, (yLo + yHi) >> 1));
        let best = null;
        let cur = null;
        for (let y = lo; y <= hi; y++) {
          if (!rowHasInk[y]) {
            if (!cur) cur = [y, y];
            else cur[1] = y;
          } else if (cur) {
            if (!best || cur[1] - cur[0] > best[1] - best[0]) best = cur;
            cur = null;
          }
        }
        if (cur && (!best || cur[1] - cur[0] > best[1] - best[0])) best = cur;
        return best ? ((best[0] + best[1]) >> 1) : ((lo + hi) >> 1);
      }

      async function detectPageLayoutCanvas(pngFile, pageNum) {
        const url = URL.createObjectURL(pngFile);
        try {
          const img = await new Promise((resolve, reject) => {
            const el = new Image();
            el.onload = () => resolve(el);
            el.onerror = reject;
            el.src = url;
          });
          const w = img.naturalWidth;
          const h = img.naturalHeight;
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0);

          const rgba = ctx.getImageData(0, 0, w, h).data;
          const gray = new Uint8Array(w * h);
          for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
            gray[i] = (rgba[p] * 77 + rgba[p + 1] * 150 + rgba[p + 2] * 29) >> 8;
          }

          const x0 = Math.floor(w * 0.05);
          const x1 = Math.floor(w * 0.95);
          const darkThreshold = (x1 - x0) * 0.65;

          const darkRows = [];
          const rowHasInk = new Uint8Array(h);
          for (let y = 0; y < h; y++) {
            const off = y * w;
            let d = 0;
            let anyInk = 0;
            for (let x = 0; x < w; x++) {
              const v = gray[off + x];
              if (v < 235) anyInk = 1;
              if (x >= x0 && x < x1 && v < 190) d++;
            }
            rowHasInk[y] = anyInk;
            if (d > darkThreshold) darkRows.push(y);
          }

          const lines = [];
          for (const y of darkRows) {
            if (!lines.length || y > lines[lines.length - 1][lines[lines.length - 1].length - 1] + 2) {
              lines.push([y]);
            } else {
              lines[lines.length - 1].push(y);
            }
          }
          const lineYs = lines.map((g) => g.reduce((a, b) => a + b, 0) / g.length);

          const grouped = [];
          for (const ly of lineYs) {
            if (!grouped.length || ly - grouped[grouped.length - 1][grouped[grouped.length - 1].length - 1] > 35) {
              grouped.push([ly]);
            } else {
              grouped[grouped.length - 1].push(ly);
            }
          }
          const staves = grouped.filter((s) => s.length === 6);
          if (!staves.length) {
            throw new Error("第 " + pageNum + " 页未能检测到 6 线吉他谱表");
          }

          const firstStaff = Math.round(staves[0][0]);
          let topCut;
          let headerSlice = null;
          if (pageNum === 1) {
            topCut = whiteGapMidJS(rowHasInk, Math.max(0, firstStaff - 170), Math.max(0, firstStaff - 60), h);
            let hMin = -1;
            let hMax = -1;
            for (let y = 0; y <= topCut; y++) {
              if (rowHasInk[y]) {
                if (hMin === -1) hMin = y;
                hMax = y;
              }
            }
            if (hMin !== -1) {
              headerSlice = [Math.max(0, hMin - 16), Math.min(topCut, hMax + 16)];
            }
          } else {
            topCut = whiteGapMidJS(rowHasInk, 90, 125, h);
          }

          const cuts = [topCut];
          for (let i = 0; i < staves.length - 1; i++) {
            const prevBot = Math.round(staves[i][5]);
            const nextTop = Math.round(staves[i + 1][0]);
            const safeLo = prevBot + 40;
            const safeHi = nextTop - 78;
            let hasSafeWhite = false;
            for (let y = safeLo; y <= safeHi; y++) {
              if (y >= 0 && y < h && !rowHasInk[y]) {
                hasSafeWhite = true;
                break;
              }
            }
            if (safeLo <= safeHi && hasSafeWhite) {
              cuts.push(whiteGapMidJS(rowHasInk, safeLo, safeHi, h));
            } else {
              cuts.push(whiteGapMidJS(rowHasInk, prevBot + 20, nextTop - 20, h));
            }
          }
          const lastBot = Math.round(staves[staves.length - 1][5]);
          cuts.push(whiteGapMidJS(rowHasInk, lastBot + 40, Math.min(h - 1, lastBot + 160), h));

          const sysEntries = [];
          for (let si = 0; si < staves.length; si++) {
            const sysLines = staves[si];
            const yTop = Math.round(sysLines[0]);
            const yBot = Math.round(sysLines[5]);
            const c0 = cuts[si];
            const c1 = cuts[si + 1];

            let ink0 = -1;
            let ink1 = -1;
            for (let y = c0; y <= c1; y++) {
              if (rowHasInk[y]) {
                if (ink0 === -1) ink0 = y;
                ink1 = y;
              }
            }
            if (ink0 === -1) {
              ink0 = yTop - 40;
              ink1 = yBot + 40;
            }
            const sliceY = [Math.max(c0, ink0 - 14), Math.min(c1, ink1 + 16)];

            const gapYs = [];
            for (let k = 0; k < 5; k++) {
              const g0 = Math.round(sysLines[k]) + 3;
              const g1 = Math.round(sysLines[k + 1]) - 3;
              for (let gy = g0; gy <= g1; gy++) gapYs.push(gy);
            }

            let sx0 = w;
            let sx1 = 0;
            for (let x = 0; x < w; x++) {
              if (gray[yTop * w + x] < 190) {
                if (x < sx0) sx0 = x;
                if (x > sx1) sx1 = x;
              }
            }
            const span = Math.max(1, yBot - yTop + 1);
            const barCols = [];
            for (let x = sx0; x <= sx1; x++) {
              let inside = 0;
              for (let y = yTop; y <= yBot; y++) {
                if (gray[y * w + x] < 140) inside++;
              }
              let below = 0;
              for (let y = yBot + 3; y < Math.min(h, yBot + 15); y++) {
                if (gray[y * w + x] < 140) below++;
              }
              if (inside >= span * 0.95 && below === 0) {
                if (x > sx1 - 20 || x < sx0 + 10) {
                  barCols.push(x);
                } else {
                  let sideDark = 0;
                  for (const gy of gapYs) {
                    if (gray[gy * w + x - 3] < 160 || gray[gy * w + x + 3] < 160) sideDark++;
                  }
                  if (sideDark <= gapYs.length * 0.15) barCols.push(x);
                }
              }
            }

            const clusters = [];
            for (const x of barCols) {
              if (!clusters.length || x > clusters[clusters.length - 1][clusters[clusters.length - 1].length - 1] + 15) {
                clusters.push([x]);
              } else {
                clusters[clusters.length - 1].push(x);
              }
            }
            const barXs = clusters.map((g) => Math.round((g.reduce((a, b) => a + b, 0) / g.length) * 10) / 10);
            const startX = pageNum === 1 && si === 0 ? Math.round(w * 0.122) : Math.round(w * 0.093);
            const boundaries = [startX, ...barXs.slice(1)];
            const barBoxes = [];
            for (let i = 0; i < boundaries.length - 1; i++) {
              barBoxes.push([boundaries[i], boundaries[i + 1]]);
            }
            if (!barBoxes.length) {
              barBoxes.push([startX, sx1]);
            }

            sysEntries.push({
              page: pageNum,
              width: w,
              height: h,
              sliceY,
              inkY: [ink0, ink1],
              staffY: [yTop, yBot],
              barBoxes
            });
          }

          return { width: w, height: h, headerSlice, sysEntries };
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      function buildManifestFromDetection(detection, opts) {
        const bpm = Math.max(20, Math.min(260, Number(opts.bpm) || 72));
        const leadIn = Math.max(0, Number(opts.leadIn) || 0);
        const firstIsPickup = Boolean(opts.pickup);
        const duration = detection.duration || 120;
        const scoreMeta = detection.scoreMeta;
        const phraseCues = detection.phraseCues || {};
        const parsedBars = scoreMeta ? scoreMeta.parsedBars : {};

        const hasZeroBar = Boolean(parsedBars[0]);
        const barOffset = (hasZeroBar || firstIsPickup) ? 0 : 1;
        const barDur = (4.0 * 60.0) / bpm;
        const beatDur = 60.0 / bpm;

        const systemsOut = [];
        const barsOut = [];
        const sectionsOut = [];
        let curSec = "Intro";
        let curTime = leadIn;
        let sysCounter = 0;
        let barIdx = 0;

        let headerInfo = null;
        if (detection.pageLayouts[0] && detection.pageLayouts[0].headerSlice) {
          const p1 = detection.pageLayouts[0];
          headerInfo = {
            page: 1,
            width: p1.width,
            height: p1.height,
            sliceY: p1.headerSlice
          };
        }

        const totalDetectedBars = detection.pageLayouts.reduce(
          (acc, pg) => acc + pg.sysEntries.reduce((s, sys) => s + sys.barBoxes.length, 0),
          0
        );

        detection.pageLayouts.forEach((pg, pgIdx) => {
          const pageNum = pgIdx + 1;
          pg.sysEntries.forEach((rawSys) => {
            const sysBars = [];
            rawSys.barBoxes.forEach(([x0, x1]) => {
              const barNum = barIdx + barOffset;
              const pInfo = parsedBars[barNum] || {};
              if (pInfo.section) {
                curSec = pInfo.section;
                sectionsOut.push({ name: curSec, bar: barNum, start: Number(curTime.toFixed(4)) });
              } else if (barIdx === 0) {
                sectionsOut.push({ name: curSec, bar: barNum, start: Number(curTime.toFixed(4)) });
              }

              const isFirstPickup = barIdx === 0 && firstIsPickup;
              const isLast = barIdx === totalDetectedBars - 1;
              const dur = isFirstPickup ? beatDur : barDur;
              const endT = isLast ? Math.max(curTime + 0.5, duration) : curTime + dur;

              const rec = {
                bar: barNum,
                sysIdx: sysCounter,
                page: pageNum,
                x0,
                x1,
                start: Number(curTime.toFixed(4)),
                end: Number(endT.toFixed(4)),
                sec: curSec,
                chords: pInfo.chords || "",
                cue: phraseCues[barNum] || ""
              };
              sysBars.push(rec);
              barsOut.push(rec);
              curTime = endT;
              barIdx++;
            });

            systemsOut.push({
              sysIdx: sysCounter,
              page: pageNum,
              width: rawSys.width,
              height: rawSys.height,
              sliceY: rawSys.sliceY,
              inkY: rawSys.inkY,
              staffY: rawSys.staffY,
              x0: sysBars[0].x0,
              x1: sysBars[sysBars.length - 1].x1,
              bars: sysBars
            });
            sysCounter++;
          });
        });

        return {
          version: 1,
          title: opts.title || (scoreMeta && scoreMeta.title) || "导入曲目",
          subtitle: (scoreMeta && scoreMeta.subtitle) || "",
          composer: (scoreMeta && scoreMeta.composer) || "",
          arrangerInfo: (scoreMeta && scoreMeta.arrangerInfo) || "",
          bpm,
          capo: scoreMeta && scoreMeta.capo !== null ? scoreMeta.capo : undefined,
          duration: Number(duration.toFixed(4)),
          audio: detection.audioName,
          pdf: detection.pdfName || "",
          pages: detection.pageNames.map((n) => "previews/" + n),
          header: headerInfo,
          sections: sectionsOut,
          systems: systemsOut,
          bars: barsOut
        };
      }

      function triggerDownloadJson(manifestObj) {
        const blob = new Blob([JSON.stringify(manifestObj, null, 2) + "\n"], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "sync_manifest.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function handleImportedFiles(rawFiles) {
        const files = rawFiles.filter((f) => !isIgnoredPath(fileRel(f)) && !f.name.startsWith("."));

        const audioFiles = files.filter((f) => /\.(mp3|wav|m4a|ogg|flac)$/i.test(f.name));
        audioFiles.sort((a, b) => {
          const am = a.name.toLowerCase().endsWith(".mp3") ? 0 : 1;
          const bm = b.name.toLowerCase().endsWith(".mp3") ? 0 : 1;
          return am - bm || b.size - a.size;
        });
        const audioFile = audioFiles[0] || null;

        let pngFiles = files
          .filter((f) => /^page[-_]?\d+\.png$/i.test(f.name))
          .sort((a, b) => parsePageNum(a.name) - parsePageNum(b.name) || a.name.localeCompare(b.name));

        if (!pngFiles.length) {
          pngFiles = files
            .filter((f) => /\.png$/i.test(f.name) && /(^|\/)previews\//i.test(fileRel(f)))
            .sort((a, b) => parsePageNum(a.name) - parsePageNum(b.name) || a.name.localeCompare(b.name));
        }

        if (!audioFile) {
          showToast("缺少 MP3", { type: "error", duration: 6000 });
          return;
        }
        if (!pngFiles.length) {
          showToast("缺少 previews/page-*.png", { type: "error", duration: 6000 });
          return;
        }

        const manifestFile = files.find((f) => f.name === "sync_manifest.json") || null;
        const scoreDataFile = files.find((f) => f.name === "score_data.py") || null;
        const buildPdfFile = files.find((f) => f.name === "build_pdf.py") || null;
        const pdfFile = files.find((f) => /\.pdf$/i.test(f.name)) || null;

        const loadingToast = showToast("正在解析…", { loading: true });

        try {
          const duration = await probeAudioFileDuration(audioFile);
          const audioBaseTitle = audioFile.name.replace(/\.[^.]+$/, "");

          if (manifestFile) {
            const parsedManifest = JSON.parse(await manifestFile.text());
            if (!parsedManifest.systems || !parsedManifest.bars) {
              throw new Error("sync_manifest.json 格式不完整");
            }

            const ownedUrls = [];
            const audioUrl = URL.createObjectURL(audioFile);
            ownedUrls.push(audioUrl);

            const pngByName = new Map(pngFiles.map((f) => [f.name, f]));
            const orderedPageUrls = (parsedManifest.pages && parsedManifest.pages.length === pngFiles.length)
              ? parsedManifest.pages.map((rel, i) => {
                  const fname = rel.split("/").pop();
                  const f = pngByName.get(fname) || pngFiles[i];
                  const u = URL.createObjectURL(f);
                  ownedUrls.push(u);
                  return u;
                })
              : pngFiles.map((f) => {
                  const u = URL.createObjectURL(f);
                  ownedUrls.push(u);
                  return u;
                });

            let pdfUrl = "";
            if (pdfFile) {
              pdfUrl = URL.createObjectURL(pdfFile);
              ownedUrls.push(pdfUrl);
            }

            revokeImportedUrls();
            activeObjectUrls = ownedUrls;
            activeDetection = null;
            isImported = true;
            hasStarted = false;
            followPaused = false;
            sheetPaper.classList.remove("started");

            setMedia(audioUrl, pdfUrl, pdfFile ? pdfFile.name : "");
            renderManifest(parsedManifest, orderedPageUrls);

            loadingToast.remove();
            showToast("已导入「" + (parsedManifest.title || audioBaseTitle) + "」", { duration: 3000 });
            return;
          }

          const scoreMeta = scoreDataFile ? parseScoreDataPy(await scoreDataFile.text()) : null;
          const phraseCues = buildPdfFile ? parsePhraseCuesPy(await buildPdfFile.text()) : {};

          const pageLayouts = [];
          for (let i = 0; i < pngFiles.length; i++) {
            pageLayouts.push(await detectPageLayoutCanvas(pngFiles[i], i + 1));
          }

          const nBars = pageLayouts.reduce(
            (acc, pg) => acc + pg.sysEntries.reduce((s, sys) => s + sys.barBoxes.length, 0),
            0
          );

          let bpm;
          let leadIn;
          let pickup;
          let title;

          if (scoreMeta) {
            bpm = scoreMeta.bpm || 72;
            pickup = Boolean(scoreMeta.parsedBars[0] && scoreMeta.parsedBars[0].isPickup);
            leadIn = Number((0.25 * 60 / bpm).toFixed(4));
            title = scoreMeta.title || audioBaseTitle;
          } else {
            leadIn = 0;
            pickup = false;
            bpm = Math.round(((240 * nBars) / Math.max(1, duration - leadIn)) * 10) / 10;
            title = audioBaseTitle;
          }

          const detection = {
            audioName: audioFile.name,
            pdfName: pdfFile ? pdfFile.name : "",
            pageNames: pngFiles.map((f) => f.name),
            duration,
            pageLayouts,
            scoreMeta,
            phraseCues,
            lastParams: { bpm, leadIn, pickup, title }
          };

          const manifest = buildManifestFromDetection(detection, detection.lastParams);

          const ownedUrls = [];
          const audioUrl = URL.createObjectURL(audioFile);
          ownedUrls.push(audioUrl);
          const orderedPageUrls = pngFiles.map((f) => {
            const u = URL.createObjectURL(f);
            ownedUrls.push(u);
            return u;
          });
          let pdfUrl = "";
          if (pdfFile) {
            pdfUrl = URL.createObjectURL(pdfFile);
            ownedUrls.push(pdfUrl);
          }

          revokeImportedUrls();
          activeObjectUrls = ownedUrls;
          activeDetection = detection;
          isImported = true;
          hasStarted = false;
          followPaused = false;
          sheetPaper.classList.remove("started");

          setMedia(audioUrl, pdfUrl, pdfFile ? pdfFile.name : "");
          renderManifest(manifest, orderedPageUrls);

          loadingToast.remove();
          showToast("已导入「" + manifest.title + "」", {
            duration: 4500,
            actionLabel: "校准",
            onAction: openCalibrationModal
          });
        } catch (err) {
          loadingToast.remove();
          showToast(err && err.message ? err.message : "解析失败", { type: "error", duration: 6000 });
        }
      }

      function loadBuiltinProject() {
        revokeImportedUrls();
        activeDetection = null;
        isImported = false;
        hasStarted = false;
        followPaused = false;
        sheetPaper.classList.remove("started");

        const pageUrls = BUILTIN_MANIFEST.pages.map(
          (p) => "./examples/call-of-silence/" + p.split("/").map(encodeURIComponent).join("/")
        );
        const audioUrl = "./examples/call-of-silence/" + encodeURIComponent(BUILTIN_MANIFEST.audio);
        const pdfUrl = "./examples/call-of-silence/" + encodeURIComponent(BUILTIN_MANIFEST.pdf);

        setMedia(audioUrl, pdfUrl, BUILTIN_MANIFEST.pdf);
        renderManifest(BUILTIN_MANIFEST, pageUrls);
      }

      loadBuiltinProject();
    })();
  </script>
</body>
</html>
